# Keycloak : keycloak.localhost
server {
    listen 80;
    server_name keycloak.localhost;

    location / {
        proxy_pass http://larpbabylone_keycloack:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Applications des associations : *.localhost (ex: babylone.localhost)
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.localhost$;

    # API backend de l'association
    location /api/ {
        proxy_pass http://larpbabylone_objects:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Transmet le sous-domaine pour que le backend identifie l'association
        proxy_set_header X-Tenant $subdomain;
    }

    # Frontend (Angular dev server)
    location / {
        proxy_pass http://larpbabylone_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Fallback : localhost sans sous-domaine
server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://larpbabylone_objects:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://larpbabylone_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
