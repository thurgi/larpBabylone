apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: larpbabylone-ingress
  namespace: larpbabylone
  labels:
    app.kubernetes.io/part-of: larpbabylone
  annotations:
    # Adapter selon votre Ingress Controller (nginx, traefik, etc.)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Décommenter pour cert-manager (TLS automatique)
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # Décommenter si vous utilisez un IngressClass spécifique
  # ingressClassName: nginx
  tls:
    - hosts:
        - larpbabylone.example.com
      secretName: larpbabylone-tls
  rules:
    - host: larpbabylone.example.com
      http:
        paths:
          # Tout le trafic arrive sur le frontend (nginx)
          # qui se charge du reverse proxy /api/ → backend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: larpbabylone-frontend
                port:
                  number: 80
