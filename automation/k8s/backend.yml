apiVersion: apps/v1
kind: Deployment
metadata:
  name: larpbabylone-backend
  namespace: larpbabylone
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: larpbabylone
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: larpbabylone
    spec:
      containers:
        - name: backend
          image: larpbabylone-backend:latest
          ports:
            - containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: larpbabylone-config
            - secretRef:
                name: larpbabylone-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: larpbabylone-data
---
apiVersion: v1
kind: Service
metadata:
  name: larpbabylone-backend
  namespace: larpbabylone
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: larpbabylone
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
