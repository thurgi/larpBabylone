openapi: 3.0.3
info:
  title: LarpBabylone auth API
  description: API d'authentification et de gestion des utilisateurs.
  version: 1.0.0

servers:
  - url: http://localhost:3002
    description: Serveur de développement

tags:
  - name: Auth
    description: Authentification OAuth2 (Discord, Google)
  - name: Groups
    description: Gestion des groupes et permissions

paths:
  # ── Authentification ──────────────────────────────────────────────────
  /auth/discord:
    get:
      tags: [Auth]
      summary: Redirection OAuth2 Discord
      description: Redirige l'utilisateur vers la page d'authentification Discord.
      responses:
        "302":
          description: Redirection vers Discord OAuth2.

  /auth/discord/callback:
    get:
      tags: [Auth]
      summary: Callback OAuth2 Discord
      description: Callback après authentification Discord. Retourne un JWT.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authentification réussie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Échec de l'authentification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/google:
    get:
      tags: [Auth]
      summary: Redirection OAuth2 Google
      description: Redirige l'utilisateur vers la page d'authentification Google.
      responses:
        "302":
          description: Redirection vers Google OAuth2.

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback OAuth2 Google
      description: Callback après authentification Google. Retourne un JWT.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authentification réussie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Échec de l'authentification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      description: Invalide la session de l'utilisateur.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Déconnexion réussie.
        "401":
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      tags: [Auth]
      summary: Utilisateur courant
      description: Retourne les informations de l'utilisateur connecté.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Informations de l'utilisateur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Users ───────────────────────────────────────────────────────────

  /users:
    get:
      tags: [Users]
      summary: lister les utilisateurs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des groupes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  # ── Groupes ───────────────────────────────────────────────────────────
  /groups:
    get:
      tags: [Groups]
      summary: Lister les groupes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des groupes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [Groups]
      summary: Créer un groupe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: Groupe créé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Données invalides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/groupId"

    get:
      tags: [Groups]
      summary: Lire un groupe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Détail du groupe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Groupe introuvable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags: [Groups]
      summary: Modifier un groupe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Groupe modifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Données invalides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Groupe introuvable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Groups]
      summary: Supprimer un groupe
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Groupe supprimé.
        "401":
          description: Non authentifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Groupe introuvable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

# ═══════════════════════════════════════════════════════════════════════
# Composants
# ═══════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    groupId:
      name: groupId
      in: path
      required: true
      description: Identifiant unique du groupe (UUID).
      schema:
        type: string
        format: uuid

  schemas:
    # ── Auth ────────────────────────────────────────────────────────────
    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: JWT d'accès.
        user:
          $ref: "#/components/schemas/User"

    # ── User ────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, username, provider]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        provider:
          type: string
          enum: [discord, google]
        providerId:
          type: string

    # ── Group ───────────────────────────────────────────────────────────
    Group:
      type: object
      required: [id, name, permissions, userIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        permissions:
          $ref: "#/components/schemas/Permissions"
        userIds:
          type: array
          items:
            type: string
            format: uuid

    GroupCreate:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        permissions:
          $ref: "#/components/schemas/Permissions"
        userIds:
          type: array
          items:
            type: string
            format: uuid

    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        permissions:
          $ref: "#/components/schemas/Permissions"
        userIds:
          type: array
          items:
            type: string
            format: uuid

    Permissions:
      type: object
      required: [documents, versions]
      properties:
        documents:
          $ref: "#/components/schemas/CrudPermissions"
        versions:
          $ref: "#/components/schemas/CrudPermissions"
        publicRead:
          type: boolean
          default: false

    CrudPermissions:
      type: object
      properties:
        create:
          type: boolean
          default: false
        read:
          type: boolean
          default: false
        update:
          type: boolean
          default: false
        delete:
          type: boolean
          default: false

    # ── Error ───────────────────────────────────────────────────────────
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
